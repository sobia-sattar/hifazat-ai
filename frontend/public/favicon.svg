<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="cyber-shield-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stopColor="#0b2347" />
      <stop offset="0.5" stopColor="#05172e" />
      <stop offset="1" stopColor="#020a17" />
    </linearGradient>
    <linearGradient id="cyber-neon-glow" x1="8" y1="4" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop stopColor="#38bdf8" />
      <stop offset="0.5" stopColor="#60a5fa" />
      <stop offset="1" stopColor="#06b6d4" />
    </linearGradient>
    <linearGradient id="core-glow" x1="16" y1="14" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop stopColor="#f0f9ff" />
      <stop offset="1" stopColor="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Cyber Security Shield -->
  <path
    d="M24 4 L40 10 V23 C40 33.5 32.5 40 24 44 C15.5 40 8 33.5 8 23 V10 L24 4 Z"
    fill="url(#cyber-shield-grad)"
    stroke="url(#cyber-neon-glow)"
    strokeWidth="2"
    strokeLinejoin="round"
  />

  <!-- Inner Tech Grid -->
  <path
    d="M24 8 L36 13 V22 C36 30 30.5 35.5 24 39 C17.5 35.5 12 30 12 22 V13 L24 8 Z"
    fill="none"
    stroke="#38bdf8"
    strokeWidth="0.8"
    strokeDasharray="2 2"
    opacity="0.5"
  />

  <!-- Cyber Node Points -->
  <circle cx="24" cy="4" r="1.8" fill="#38bdf8" />
  <circle cx="8" cy="23" r="1.4" fill="#38bdf8" opacity="0.8" />
  <circle cx="40" cy="23" r="1.4" fill="#38bdf8" opacity="0.8" />

  <!-- Futuristic Cyber 'H' Core -->
  <path d="M18 16 V32" stroke="url(#core-glow)" strokeWidth="3.2" strokeLinecap="round" />
  <path d="M30 16 V32" stroke="url(#core-glow)" strokeWidth="3.2" strokeLinecap="round" />
  <path d="M18 24 H30" stroke="url(#core-glow)" strokeWidth="2.8" strokeLinecap="round" />

  <!-- Central Security Diamond Node -->
  <path d="M24 21 L27 24 L24 27 L21 24 Z" fill="#ffffff" filter="url(#glow)" />
  <circle cx="24" cy="24" r="1" fill="#0284c7" />
</svg>
