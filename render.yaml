services:
  # ── Backend (Python FastAPI) ────────────────────────────────────────────────
  - type: web
    name: hifazat-ai-backend
    runtime: python
    region: singapore          # closest to Pakistan
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .:backend
      - key: PUBLIC_DEPLOYMENT
        value: "true"
      - key: CORS_ORIGINS
        value: https://hifazat-ai.onrender.com
      - key: FORCE_DEMO_MODE
        value: "false"
      - key: YOUTUBE_API_KEY
        sync: false            # set manually in Render dashboard (optional)

  # ── Frontend (React/Vite Static Site) ──────────────────────────────────────
  - type: web
    name: hifazat-ai
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://hifazat-ai-backend.onrender.com
